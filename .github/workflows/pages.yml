name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The deploy job needs these; the defaults are read-only.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it, so a burst of
# pushes does not leave the site half-published.
concurrency:
  group: pages
  cancel-in-progress: false

# Action versions checked against their own release notes, November
# 2026. All run on Node 24, which GitHub now requires. The one change that
# could have bitten is upload-pages-artifact leaving hidden files out of
# the upload from v4 on, and the built site has none.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
